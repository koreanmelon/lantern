name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: Exact source commit to validate; defaults to the event ref
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  check:
    name: Format, vet, and test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.ref }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Check formatting
        run: |
          unformatted="$(gofmt -l .)"
          if [[ -n "$unformatted" ]]; then
            printf 'Run gofmt on:\n%s\n' "$unformatted"
            exit 1
          fi
      - name: Check module files
        run: |
          go mod tidy
          git diff --no-ext-diff --no-textconv --exit-code -- go.mod go.sum
      - name: Vet
        run: go vet -tags=integration ./...
      - name: Unit tests
        run: go test -race -shuffle=on -count=1 ./...
      - name: Integration tests (including compiled-app restart smoke)
        run: go test -race -shuffle=on -count=1 -tags=integration ./tests/integration/...
      - name: Test APT repository tooling with isolated clients
        # Older source tags predate the APT tooling; reusable CI still supports them.
        if: hashFiles('scripts/apt_repository.py') != ''
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y apt-utils gnupg
          python3 -m unittest discover -s scripts/tests -v
